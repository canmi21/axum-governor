[package]
name = "canmi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "My addresses and identity, for Rust."
keywords = ["canmi"]

[lints]
workspace = true

# The Rust half of the `@canmi/me` package: `src/lib.rs` is generated from
# pkgs/me/urls/src/index.ts and identity/author.json by `mise run urls`. See spec/me/addresses.md, "The Rust half is
# generated, never written".
[lib]
path = "src/lib.rs"

[package]
name = "canmi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The author's own facts for Rust: their sites' addresses, the world's, and who they are"

[lints]
workspace = true

# The Rust half of the `@canmi/me` package: `src/lib.rs` is generated from
# pkgs/me/urls/src/index.ts by `mise run urls`. See spec/me/addresses.md, "The Rust half is
# generated, never written".
[lib]
path = "src/lib.rs"

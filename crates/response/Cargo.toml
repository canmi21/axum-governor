[package]
name = "response"
version = "2.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The answer envelope every API here speaks, the Rust half of @canmi/response"

[lints]
workspace = true

# The Rust half of @canmi/response: the envelope, and the codes both halves read from codes.json.
[lib]
path = "src/lib.rs"

[features]
axum = ["dep:axum"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

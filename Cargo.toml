# Every crate the library publishes, one directory each under crates/. A workspace of its own, so
# Cargo stops here rather than walking up into the workspace this repository is cloned beside.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/canmi21/lib"

[workspace.lints.clippy]
# `style` is left at clippy's default, a warning; see the workspace's spec/lint-format.md.
correctness = "deny"
suspicious = "deny"
complexity = "warn"

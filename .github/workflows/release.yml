# Publishes each dated package whose tree changed: on schedule just after midnight UTC for the day
# that ended, or by hand for today. Every token is short-lived and asked for here: npm's through
# trusted publishing, crates.io's through its auth action. See spec/repository.md, "Versions and
# publishing".
name: Release

on:
  schedule:
    - cron: "11 0 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Which UTC day the version names"
        type: choice
        options: [today, yesterday]
        default: today

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      # The workspace above the project, as it is checked out at home: its mise.toml pins the
      # tools and its rust-toolchain.toml the compiler.
      - uses: actions/checkout@v7
        with:
          repository: canmi21/canmi
      - uses: actions/checkout@v7
        with:
          path: repos/lib
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - working-directory: repos/lib
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run
      - id: crates
        uses: rust-lang/crates-io-auth-action@v1
      - working-directory: repos/lib
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: .mise/tasks/release --day "${{ github.event_name == 'schedule' && 'yesterday' || inputs.day }}"

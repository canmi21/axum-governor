# Publishes each dated package whose tree changed, as soon as the change reaches main, or by hand.
# Every token is short-lived and asked for here: npm's through trusted publishing, crates.io's
# through its auth action. See spec/repository.md, "Versions and publishing".
name: Release

on:
  push:
    branches: [main]
    paths:
      - "pkgs/**"
      - "crates/canmi/**"
  workflow_dispatch:

# One at a time, in the order pushed, and never cancelled: a run numbers the day's versions from
# the tags the one before it pushed, and a release stopped halfway has published without tagging.
# `queue: max` keeps every waiting run, up to GitHub's hundred, where the default keeps the newest.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      # The workspace above the project, as it is checked out at home: its mise.toml pins the
      # tools and its rust-toolchain.toml the compiler.
      - uses: actions/checkout@v7
        with:
          repository: canmi21/canmi
      - uses: actions/checkout@v7
        with:
          path: repos/lib
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - working-directory: repos/lib
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run
      - id: crates
        uses: rust-lang/crates-io-auth-action@v1
      - working-directory: repos/lib
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: .mise/tasks/release

[tasks.check]
description = "Type-check every crate and its targets, and every package's TypeScript"
run = ["cargo check --all-targets", "pnpm exec tsc -p tsconfig.json"]

# Both feature extremes are linted because every optional feature has a `not(feature)` twin
# that only compiles when the feature is off; `--all-features` alone never sees those.
[tasks.lint]
description = "Lint every crate at both feature extremes, warnings denied"
run = [
	"cargo clippy --all-targets --all-features -- -D warnings",
	"cargo clippy --all-targets --no-default-features -- -D warnings",
	'oxlint pkgs ${AUDIT:+--deny-warnings}',
]

[tasks.test]
description = "Run every crate's tests at both feature extremes, and every package's"
run = ["cargo test --all-features", "cargo test --no-default-features", "pnpm exec vitest run"]

# What is published is what this builds, so a package that does not build is a failed change.
[tasks.build]
description = "Build every package into its dist/"
run = "pnpm -r run build"

[tasks.verify]
description = "Everything a change has to pass"
depends = ["check", "lint", "test", "build"]

# The Rust half of `canmi` is rendered from its TypeScript, so an address is written once.
[tasks.urls]
description = "Regenerate the canmi crate from the canmi package's addresses"
run = ["node pkgs/canmi/urls/scripts/rust.ts", "cargo fmt -- crates/canmi/src/lib.rs"]

# Reached from the workspace as `mise run publish lib`, for axum-governor alone until the release
# pipeline publishes each package; see spec/repository.md. It depends on verify because a
# release is the one thing that cannot be taken back: crates.io accepts a version once and
# yanking leaves it downloadable. `--dry-run` threads through to cargo's own.
[tasks.publish]
description = "Publish axum-governor to crates.io: `publish [--dry-run]`"
depends = ["verify"]
run = "cargo publish -p axum-governor"

# The verbs the workspace one directory up dispatches to: `mise run update|clean|fmt [name]`.
# Each takes --dry-run and keeps the promises the workspace's spec/architecture/repos.md lists
# under "What a repository's task owes the verb"; the revert after a failed verify is the
# workspace's, so `update` neither verifies nor reverts.
[tasks.update]
description = "Move dependencies within the ranges Cargo.toml declares, and name what waits beyond: `update [--dry-run] [--major]`"
usage = '''
flag "-n --dry-run" help="Say what would move and write nothing"
flag "--major" help="Cross the ranges Cargo.toml declares"
'''
run = '''
n=${usage_dry_run:+--dry-run}
if [ -n "${usage_major:-}" ]; then cargo upgrade --incompatible $n; fi
cargo update $n
[ -z "${usage_major:-}" ] || exit 0
echo
echo "Beyond the ranges Cargo.toml declares:"
if ! cargo upgrade --version >/dev/null 2>&1; then
	echo "  cargo upgrade is missing, so no crate's major was checked; cargo-edit supplies it"
	exit 0
fi
beyond=$(cargo upgrade --incompatible --dry-run 2>/dev/null)
echo "${beyond:-  nothing; every dependency is at the top of its range}"
'''

[tasks.clean]
description = "Remove what cargo built: `clean [--dry-run]`"
usage = 'flag "-n --dry-run" help="Say what would go and remove nothing"'
run = "cargo clean ${usage_dry_run:+--dry-run}"

# The file set is jj.toml's, so `fmt` and the formatting a commit gets agree.
[tasks.fmt]
description = "Format the Rust and the prose beside it, with jj.toml's formatters: `fmt [--dry-run]`"
usage = 'flag "-n --dry-run" help="List the files that would change and write nothing"'
run = '''
files='**/*.{ts,tsx,mts,cts,js,mjs,cjs,jsx,css,json,jsonc,md,svelte}'
if [ -n "${usage_dry_run:-}" ]; then
	cargo fmt --all --check --message-format short || true
	oxfmt --list-different --no-error-on-unmatched-pattern "$files" || true
else
	cargo fmt --all
	oxfmt --no-error-on-unmatched-pattern "$files"
fi
'''

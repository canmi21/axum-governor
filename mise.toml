[tasks.check]
description = "Type-check the crate and its targets"
run = "cargo check --all-targets"

# Both feature extremes are linted because every optional feature has a `not(feature)` twin
# that only compiles when the feature is off; `--all-features` alone never sees those.
[tasks.lint]
description = "Lint the crate at both feature extremes, warnings denied"
run = [
	"cargo clippy --all-targets --all-features -- -D warnings",
	"cargo clippy --all-targets --no-default-features -- -D warnings",
]

[tasks.test]
description = "Run the test suite at both feature extremes"
run = ["cargo test --all-features", "cargo test --no-default-features"]

[tasks.verify]
description = "Everything a change has to pass"
depends = ["check", "lint", "test"]

# Reached from the workspace as `mise run publish governor`. It depends on verify because a
# release is the one thing that cannot be taken back: crates.io accepts a version once and
# yanking leaves it downloadable. `--dry-run` threads through to cargo's own.
[tasks.publish]
description = "Publish the crate to crates.io: `publish [--dry-run]`"
depends = ["verify"]
run = "cargo publish"
